[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exovet"
version = "0.1.0"
description = "EXOVET — AI-enabled detection and vetting of exoplanets from noisy astronomical light curves"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["exovet*"]
